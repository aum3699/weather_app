<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name"
            spellcheck="false">
            <button><img src="images/search.png" alt="Search"></button>
        </div>
        <div class="error" style="display: none; color: red;">
            <p>City not found. Please enter a valid city name.</p>
        </div>
        <div class="weather">
            <img src="images/rain.png" class="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">NEW YORK</h2>
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png">
                    <div>
                        <p class="wind-speed">15 km/hr</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>

    <script>
        const API_KEY = 'd6310c2ddcd29beb918e9ff5b4bc1a96';
        const API_URL = 'https://api.openweathermap.org/data/2.5/weather?units=metric&q=';
        const UV_API_KEY = 'openuv-14d6prrmohzopo3-io';
        const UV_API_URL = 'https://api.openuv.io/api/v1/uv';
        document.addEventListener('DOMContentLoaded', () => {
            const searchBox = document.querySelector('.search input');
            const searchBtn = document.querySelector('.search button');
            async function checkWeather(city) {
                try {
                    console.log('Fetching weather for:', city);
                    const url = API_URL + city + '&appid=' + API_KEY;
                    console.log('URL:', url);
                    const response = await fetch(url);
                    console.log('Response status:', response.status);
                    if (!response.ok) {
                        throw new Error('City not found');
                    }
                    const data = await response.json();
                    console.log('Weather data:', data);
                    document.querySelector('.temp').textContent = Math.round(data.main.temp) + '°C';
                    document.querySelector('.city').textContent = data.name + ', ' + data.sys.country;
                    document.querySelector('.humidity').textContent = data.main.humidity + '%';
                    document.querySelector('.wind-speed').textContent = Math.round(data.wind.speed) + ' km/h';
                    const weatherIcon = document.querySelector('.weather-icon');
                    const weatherMain = data.weather[0].main.toLowerCase();
                    console.log('Weather condition:', weatherMain);
                    switch(weatherMain) {
                        case 'clear':
                            weatherIcon.src = 'images/clear.png';
                            break;
                        case 'clouds':
                            weatherIcon.src = 'images/clouds.png';
                            break;
                        case 'rain':
                            weatherIcon.src = 'images/rain.png';
                            break;
                        case 'drizzle':
                            weatherIcon.src = 'images/drizzle.png';
                            break;
                        case 'mist':
                        case 'haze':
                        case 'smoke':
                            weatherIcon.src = 'images/mist.png';
                            break;
                        case 'snow':
                            weatherIcon.src = 'images/snow.png';
                            break;
                        default:
                            weatherIcon.src = 'images/clouds.png';
                    }
                    try {
                        const uvUrl = UV_API_URL + '?lat=' + data.coord.lat + '&lng=' + data.coord.lon;
                        console.log('Fetching UV Index from:', uvUrl);
                        const uvResponse = await fetch(uvUrl, {
                            method: 'GET',
                            headers: {
                                'x-access-token': UV_API_KEY,
                                'Content-Type': 'application/json'
                            }
                        });
                        if (uvResponse.ok) {
                            const uvData = await uvResponse.json();
                            console.log('UV data:', uvData);
                            const uvElement = document.querySelector('.uv-index');
                            if (uvElement) {
                                uvElement.textContent = uvData.result.uv ? uvData.result.uv.toFixed(1) : 'N/A';
                            }
                        } else {
                            console.warn('UV API response not ok:', uvResponse.status);
                        }
                    } catch (uvError) {
                        console.warn('Could not fetch UV index:', uvError);
                    }
                    document.querySelector('.weather').style.display = 'block';
                    document.querySelector('.error').style.display = 'none';
                } catch (error) {
                    console.error('Error:', error);
                    document.querySelector('.error').style.display = 'block';
                    document.querySelector('.weather').style.display = 'none';
                }
            }
            searchBtn.addEventListener('click', () => {
                const city = searchBox.value.trim();
                if (city) {
                    checkWeather(city);
                }
            });
            searchBox.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    const city = searchBox.value.trim();
                    if (city) {
                        checkWeather(city);
                    }
                }
            });
            checkWeather('London');
        });
    </script>
</body>
</html>
